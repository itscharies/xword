name: Fetch daily puzzle

on:
  schedule:
    # Run once an hour, at 5 past, so each source has a little time to
    # publish before we poll. Each fetcher writes straight to Supabase, so a
    # new puzzle is live the moment it's saved — no commit or redeploy needed.
    - cron: "5 * * * *" # hourly, 5 min past the hour
  workflow_dispatch: {}

concurrency:
  group: fetch-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js needs a native WebSocket, which Node only
          # ships from 22 onward — Node 20 makes every fetcher crash on
          # createClient().
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch new puzzles
        run: npm run fetch
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
